name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Build NovaAI APK
      run: |
        if [ -d "novaai" ]; then
          cd novaai
        fi
        
        # 1. .env dosyasına geçerli bir dummy anahtar yaz (BuildConfig String syntax hatasını engeller)
        printf "GROQ_API_KEY=gsk_default_placeholder_key_here\n" > .env.example
        printf "GROQ_API_KEY=gsk_default_placeholder_key_here\n" > .env
        
        # 2. debug.keystore oluştur
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        
        # 3. Önbelleği temizleyerek APK derle
        gradle clean assembleDebug --no-build-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NovaAI-APK
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 30
